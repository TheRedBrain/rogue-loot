plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id "me.modmuss50.mod-publish-plugin" version "2.1.1"
}

// Game versions this build is published for, oldest first (colon separated in gradle.properties).
// The first entry is the manifest minimum, the whole list feeds the CurseForge/Modrinth tags.
ext.minecraftCompatVersions = project.minecraft_compat_versions.split(':').collect { it.trim() }.findAll { it }

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Fzzy Config, Lootables
	maven {
		name = "FzzyMaven"
		url = "https://maven.fzzyhmstrs.me/"
	}

	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"rogueloot" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

sourceSets {
	testmod {
		compileClasspath += sourceSets.main.compileClasspath
		runtimeClasspath += sourceSets.main.runtimeClasspath
	}

	testmodClient {
		compileClasspath += sourceSets.main.compileClasspath
		runtimeClasspath += sourceSets.main.runtimeClasspath
		compileClasspath += sourceSets.client.compileClasspath
		runtimeClasspath += sourceSets.client.runtimeClasspath

		compileClasspath += sourceSets.testmod.compileClasspath
		runtimeClasspath += sourceSets.testmod.runtimeClasspath
	}
}

loom {
	runs {
		testmodClient {
			client()
			ideConfigGenerated project.rootProject == project
			name = "Testmod Client"
			source sourceSets.testmodClient
		}
		testmodServer {
			server()
			ideConfigGenerated project.rootProject == project
			name = "Testmod Server"
			source sourceSets.testmod
		}
	}

	mods {
		"rogueloot_test" {
			sourceSet sourceSets.testmod
			sourceSet sourceSets.testmodClient
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Fzzy Config
	implementation ("me.fzzyhmstrs:fzzy_config:${project.fzzy_config_version}") {
		exclude(group: "me.lucko")
		exclude(group: "com.terraformersmc")
	}

	// Data Fixer
	implementation "maven.modrinth:easy-data-fix:${project.easy_data_fix_version}-fabric"

	// Test mod
	testmodImplementation sourceSets.main.output
	testmodClientImplementation sourceSets.main.output
	testmodClientImplementation sourceSets.client.output
	testmodClientImplementation sourceSets.testmod.output

//	// Lootable
//	implementation "me.fzzyhmstrs:lootables:${project.lootable_version}"

}

processResources {
	inputs.property "version", project.version
	filteringCharset "UTF-8"

	filesMatching("fabric.mod.json") {
		expand(project.properties)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

ext.changelog_last_section = { ->
	return new File("CHANGELOG.md").text.split('\n# ')[0]
}

// Publishing is configured unconditionally: tasks only *run* when explicitly invoked
// (e.g. `publishMod` in CI), and all credentials are lazy env providers, so a local
// `build` — with none of the tokens present — is completely unaffected.
def releaseTypeName = (project.findProperty('release_type') ?: 'beta').toString()

// Local convenience alias -- CI invokes the per-destination publish tasks directly.
tasks.register("publishMod") {
	dependsOn(build)
	finalizedBy(tasks.named("publishMods"))
}

publishMods {
	file = jar.archiveFile
	changelog = providers.provider { changelog_last_section() }   // lazy: read only at publish
	type = releaseTypeName == "release" ? me.modmuss50.mpp.ReleaseType.STABLE
			: releaseTypeName == "alpha" ? me.modmuss50.mpp.ReleaseType.ALPHA
			: me.modmuss50.mpp.ReleaseType.BETA
//    version = "${project.version}-${platform}" // per-loader suffix -> unique Modrinth version
	version = "${project.version}"
//	displayName = "${project.version}"
	modLoaders.add("fabric")

	curseforge {
		projectId = providers.environmentVariable("CURSEFORGE_PROJECT_ID")
		accessToken = providers.environmentVariable("CURSEFORGE_API_KEY")
		minecraftVersions.addAll(project.minecraftCompatVersions)
		client = true
		server = true
		changelogType = "markdown"
		requires(
				"fzzy-config",
				"fabric-api",
				"easy-data-fix"
		)
		optional(
				"lootables",
				"loot-n-explore"
		)
	}

	modrinth {
		environment = me.modmuss50.mpp.platforms.modrinth.ModrinthEnvironment.CLIENT_AND_SERVER
		projectId = providers.environmentVariable("MODRINTH_PROJECT_ID")
		accessToken = providers.environmentVariable("MODRINTH_API_KEY")
		minecraftVersions.addAll(rootProject.minecraftCompatVersions)
		requires(
				"fzzy-config",
				"fabric-api",
				"easy-data-fix"
		)
		optional(
				"lootables",
				"loot-n-explore"
		)
	}

	// Each platform publishes its own GitHub release under a distinct, platform-suffixed
	// tag (e.g. `1.0.0+1.21.1-fabric`), so the two publish jobs don't collide.
	github {
		repository = providers.environmentVariable("GH_OWNER")
				.zip(providers.environmentVariable("GH_REPO")) { owner, repo -> "$owner/$repo" }
		accessToken = providers.environmentVariable("GH_API_KEY")
		tagName = "${project.version}"
		// `commitish` is REQUIRED by the plugin. GITHUB_SHA is set automatically by GitHub
		// Actions to the triggering commit — valid even in a detached-HEAD checkout.
		commitish = providers.environmentVariable("GITHUB_SHA")
	}
}

// GitHub release last: a failed mod upload aborts the build before the release exists.
// Ordering only -- unselected tasks are ignored. Must sit after the publishMods block.
tasks.named("publishGithub") {
	mustRunAfter(tasks.named("publishCurseforge"), tasks.named("publishModrinth"))
}
